<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Name Spinner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎡 Free Random Name Spinner</h1>
        <p>Add one name per line:</p>
        <textarea id="names" rows="10" placeholder="Alice&#10;Bob&#10;Charlie&#10;David"></textarea>
        
        <div class="buttons">
            <button onclick="addExample()">Example Names</button>
            <button onclick="spin()">SPIN THE WHEEL</button>
            <button onclick="clearNames()">Clear</button>
        </div>

        <div class="wheel-wrapper">
            <canvas id="wheel" width="300" height="300"></canvas>
            <div class="pointer">▼</div>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
